<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .beat3-wrapper {
          position: relative;
          width: 1800px;
          height: 820px;
          margin-top: 40px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .reel-column {
          width: 330px;
          height: 740px;
          background: rgba(11, 20, 38, 0.92);
          border-radius: 16px;
          overflow: hidden;
          box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
          display: flex;
          flex-direction: column;
        }

        .reel-column.left-reel {
          border: 2px solid rgba(245, 158, 11, 0.6);
        }

        .reel-column.right-reel {
          border: 2px solid rgba(6, 182, 212, 0.6);
        }

        .reel-header {
          padding: 16px 18px;
          font-size: 14px;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }

        .left-reel .reel-header {
          background: rgba(245, 158, 11, 0.2);
          color: #fbbf24;
          border-bottom: 1px solid rgba(245, 158, 11, 0.3);
        }

        .right-reel .reel-header {
          background: rgba(6, 182, 212, 0.2);
          color: #06b6d4;
          border-bottom: 1px solid rgba(6, 182, 212, 0.3);
        }

        .reel-scroll-track {
          display: flex;
          flex-direction: column;
          gap: 16px;
          padding: 16px;
        }

        .reel-card {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 10px;
          padding: 12px;
          display: flex;
          gap: 14px;
          align-items: center;
        }

        .reel-card-icon {
          width: 60px;
          height: 60px;
          background: rgba(0,0,0,0.5);
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .reel-card-icon img {
          width: 48px;
          height: 48px;
        }

        .reel-card-info h4 {
          font-size: 15px;
          font-weight: 700;
          color: #f1f5f9;
        }

        .reel-card-info p {
          font-size: 12px;
          color: #94a3b8;
          margin-top: 2px;
        }

        .beat3-center-stage {
          width: 1060px;
          height: 740px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
        }

        .beat3-center-photo {
          width: 1000px;
          height: 500px;
          border-radius: 16px;
          border: 2px solid rgba(255, 255, 255, 0.2);
          overflow: hidden;
          box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        .beat3-center-photo img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        .beat3-bridge-badge {
          margin-top: 24px;
          background: linear-gradient(90deg, rgba(245, 158, 11, 0.25), rgba(6, 182, 212, 0.25));
          border: 1px solid rgba(255, 255, 255, 0.2);
          padding: 12px 32px;
          border-radius: 30px;
          font-size: 18px;
          font-weight: 700;
          color: #ffffff;
          box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
      </style>

      <div
        id="root"
        data-composition-id="beat3"
        data-width="1920"
        data-height="1080"
      >
        <div class="beat3-wrapper">
          <!-- Left Reel: 1987-1991 Foundations -->
          <div class="reel-column left-reel" id="b3_left_reel" data-layout-allow-overlap data-layout-allow-overflow>
            <div class="reel-header" data-layout-allow-overlap>1987–1991 College Foundations</div>
            <div class="reel-scroll-track" id="b3_left_track" data-layout-allow-overflow data-layout-allow-overlap>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/carnot_cycle.svg" alt="Carnot" />
                </div>
                <div class="reel-card-info">
                  <h4>Carnot Cycle</h4>
                  <p>Thermodynamic limits</p>
                </div>
              </div>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/mollier_chart.svg" alt="Mollier" />
                </div>
                <div class="reel-card-info">
                  <h4>Mollier Diagram</h4>
                  <p>Enthalpy-entropy charts</p>
                </div>
              </div>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/workshop_gdt.svg" alt="GD&T" />
                </div>
                <div class="reel-card-info">
                  <h4>Workshop GD&T</h4>
                  <p>Lathes & precision fits</p>
                </div>
              </div>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/fourier_heat.svg" alt="Fourier" />
                </div>
                <div class="reel-card-info">
                  <h4>Fourier Conduction</h4>
                  <p>Thermal gradients</p>
                </div>
              </div>
            </div>
          </div>

          <!-- Center Stage -->
          <div class="beat3-center-stage" id="b3_center">
            <div class="beat3-center-photo">
              <img src="assets/photo_deskewed.jpg" alt="Center Stage Photo" />
            </div>
            <div class="beat3-bridge-badge">
              35-Year Bridge: From Slide Rules & Steam Tables to Robotics & FEA
            </div>
          </div>

          <!-- Right Reel: 1991-2026 Modern Industry -->
          <div class="reel-column right-reel" id="b3_right_reel" data-layout-allow-overlap data-layout-allow-overflow>
            <div class="reel-header" data-layout-allow-overlap>1991–2026 Modern Industry</div>
            <div class="reel-scroll-track" id="b3_right_track" data-layout-allow-overflow data-layout-allow-overlap>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/quadruped_linkage.svg" alt="Robotics" />
                </div>
                <div class="reel-card-info">
                  <h4>Autonomous Robotics</h4>
                  <p>Dynamic kinematics</p>
                </div>
              </div>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/fea_meshing.svg" alt="FEA" />
                </div>
                <div class="reel-card-info">
                  <h4>FEA Mesh Solvers</h4>
                  <p>Von Mises stress fields</p>
                </div>
              </div>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/cfd_vortex.svg" alt="CFD" />
                </div>
                <div class="reel-card-info">
                  <h4>CFD Vortex Flow</h4>
                  <p>Aerodynamic drag models</p>
                </div>
              </div>
              <div class="reel-card">
                <div class="reel-card-icon">
                  <img src="assets/milestones/additive_lattice.svg" alt="Additive" />
                </div>
                <div class="reel-card-info">
                  <h4>Additive Lattice</h4>
                  <p>Laser powder-bed fusion</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#b3_center",
          { scale: 0.92, opacity: 0 },
          { scale: 1.0, opacity: 1, duration: 1.0, ease: "power2.out" },
          0.2
        );

        tl.fromTo("#b3_left_reel",
          { x: -70, opacity: 0 },
          { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
          0.3
        );

        tl.fromTo("#b3_right_reel",
          { x: 70, opacity: 0 },
          { x: 0, opacity: 1, duration: 1.0, ease: "power3.out" },
          0.5
        );

        // Continuous mechanical reel translation
        tl.fromTo("#b3_left_track",
          { y: 0 },
          { y: -160, duration: 13.0, ease: "none" },
          0.5
        );

        tl.fromTo("#b3_right_track",
          { y: -160 },
          { y: 0, duration: 13.0, ease: "none" },
          0.5
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["beat3"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
